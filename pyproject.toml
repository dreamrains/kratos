[project]
name = "data-agent"
version = "0.1.0"
description = "数据分析专家型 AI Agent - 通过自然语言完成专业级数据分析"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.60",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "prophet>=1.1",
    "plotly>=5.18",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "xhtml2pdf>=0.2",
    "mistune>=3.0",
    "kaleido>=0.2",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "flask>=3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
data-agent = "data_agent.main:main"
data-agent-web = "data_agent.web.entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_agent"]
