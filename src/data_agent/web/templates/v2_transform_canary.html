<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Agent V2 · Slice 3 日期转换</title>
    <style>
        :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f6f5; color: #1d2824; }
        main { width: min(900px, calc(100% - 32px)); margin: 36px auto 72px; }
        header { display: flex; justify-content: space-between; align-items: flex-start; gap: 22px; margin-bottom: 22px; }
        h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.03em; }
        h2 { font-size: 18px; margin: 0 0 14px; }
        .subtitle { margin: 0; color: #66736e; line-height: 1.55; }
        .badge { white-space: nowrap; border: 1px solid #e4cf9d; background: #fff5db; color: #765714; border-radius: 999px; padding: 7px 11px; font-size: 12px; }
        .panel { margin-bottom: 16px; border: 1px solid #dde4e0; border-radius: 16px; padding: 20px; background: #fff; box-shadow: 0 12px 30px rgba(24,45,38,.055); }
        .grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
        label { display: block; margin-bottom: 7px; color: #59645f; font-size: 12px; font-weight: 700; }
        input, button { font: inherit; }
        input[type="text"], input[type="file"] { width: 100%; min-height: 44px; border: 1px solid #cdd7d2; border-radius: 10px; padding: 10px 12px; background: #fcfdfc; }
        input:focus { outline: 3px solid rgba(188,130,16,.15); border-color: #a97612; }
        .question-row { margin-top: 14px; }
        .actions { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
        button { min-height: 42px; padding: 0 18px; border: 0; border-radius: 10px; background: #8a6417; color: #fff; font-weight: 700; cursor: pointer; }
        button:hover { background: #715111; }
        button:disabled { background: #aaa79e; cursor: wait; }
        .secondary { background: #eff1ef; color: #43514b; }
        .secondary:hover { background: #e4e8e5; }
        .status, .file-state, .run-id { color: #68746f; font-size: 12px; overflow-wrap: anywhere; }
        .progress { display: none; }
        .progress.visible { display: block; }
        .progress-list { display: grid; gap: 8px; }
        .progress-item { display: flex; align-items: center; gap: 9px; color: #53605b; font-size: 13px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #bf8618; box-shadow: 0 0 0 4px #f8edcf; }
        .choice-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .choice-card { border: 1px solid #dfd4ba; border-radius: 13px; padding: 16px; background: #fffdf7; }
        .choice-card h3 { margin: 0 0 8px; font-size: 16px; }
        .choice-card p { margin: 0 0 12px; color: #69736e; line-height: 1.55; font-size: 13px; }
        .choice-card button { width: 100%; }
        .answer { display: grid; gap: 14px; }
        .answer:empty::before { content: "转换完成后，可读血缘会显示在这里。"; color: #83908a; }
        .answer-block { border-left: 3px solid #b98218; padding: 3px 0 3px 16px; }
        .answer-block h2 { margin: 0 0 8px; }
        .answer-block p { margin: 0; line-height: 1.7; color: #384640; overflow-wrap: anywhere; }
        .answer-block ul { color: #63706b; }
        .error { display: none; margin-bottom: 16px; border: 1px solid #f0c6c2; border-radius: 12px; padding: 13px 15px; background: #fff0ef; color: #8c2d27; }
        .error.visible { display: block; }
        [hidden] { display: none !important; }
        @media (max-width: 700px) { header { flex-direction: column; } .grid, .choice-list { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <h1>日期转换与语义确认</h1>
            <p class="subtitle">无损且无歧义的转换自动执行；只有日期顺序确实存在多种解释时才请你选择。</p>
        </div>
        <span class="badge">Semantic confirmation canary</span>
    </header>
    <div id="error" class="error" role="alert"></div>
    <section class="panel" aria-labelledby="input-heading">
        <h2 id="input-heading">转换请求</h2>
        <div class="grid">
            <div>
                <label for="file">上传数据文件</label>
                <input id="file" type="file" accept=".csv,.tsv,.xlsx,.xls,.json,.jsonl,.parquet">
                <div id="file-state" class="file-state">尚未上传文件</div>
            </div>
            <div>
                <label for="date-column">日期列</label>
                <input id="date-column" type="text" value="order_date" autocomplete="off">
            </div>
        </div>
        <div class="question-row">
            <label for="question">问题</label>
            <input id="question" type="text" value="把订单日期转换为可分析的日期字段。" autocomplete="off">
        </div>
        <div class="actions">
            <button id="run" type="button">开始转换</button>
            <button id="restore" class="secondary" type="button">刷新恢复</button>
            <span id="status" class="status">等待输入</span>
        </div>
        <div id="run-id" class="run-id"></div>
    </section>
    <section id="progress" class="panel progress" aria-labelledby="progress-heading">
        <h2 id="progress-heading">实时进度</h2>
        <div id="progress-list" class="progress-list" aria-live="polite"></div>
    </section>
    <section id="confirmation" class="panel" aria-labelledby="confirmation-heading" hidden>
        <h2 id="confirmation-heading">请选择日期含义</h2>
        <p class="subtitle">两个候选都能无损解析，但会得到不同日期。这个语义只能由你决定。</p>
        <div id="choice-list" class="choice-list"></div>
    </section>
    <section class="panel" aria-labelledby="answer-heading">
        <h2 id="answer-heading">转换结果</h2>
        <div id="answer" class="answer" aria-live="polite"></div>
    </section>
</main>
<script src="{{ url_for('static', filename='js/v2_transform_canary.js', v='slice3a2') }}"></script>
</body>
</html>
