<!DOCTYPE html>
<html lang="zh-CN" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Agent</title>
    {% set vendor_version = '20260707-local' %}
    <script src="{{ url_for('static', filename='vendor/tailwindcss/tailwind-play-cdn.js') }}?v={{ vendor_version }}"></script>
    <script>
        if (window.tailwind) {
            window.tailwind.config = {
                darkMode: 'class',
                theme: {
                    extend: {
                        fontFamily: {
                            sans: ['ui-sans-serif', 'system-ui', 'sans-serif'],
                        },
                        colors: {
                            brand: {
                                50: '#f0fdfa',
                                100: '#ccfbf1',
                                200: '#99f6e4',
                                300: '#5eead4',
                                400: '#2dd4bf',
                                500: '#14b8a6',
                                600: '#0d9488',
                                700: '#0f766e',
                                800: '#115e59',
                                900: '#134e4a',
                            }
                        }
                    }
                }
            }
        }
    </script>
    <script src="{{ url_for('static', filename='vendor/htmx/htmx-1.9.12.min.js') }}?v={{ vendor_version }}"></script>
    <script defer src="{{ url_for('static', filename='vendor/alpinejs/alpinejs-3.14.8.min.js') }}?v={{ vendor_version }}"></script>
    <script src="{{ url_for('static', filename='vendor/marked/marked-15.0.4.min.js') }}?v={{ vendor_version }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex-0.16.11.min.css') }}?v={{ vendor_version }}">
    <script src="{{ url_for('static', filename='vendor/katex/katex-0.16.11.min.js') }}?v={{ vendor_version }}"></script>
    <script src="{{ url_for('static', filename='vendor/mermaid/mermaid-11.min.js') }}?v={{ vendor_version }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/highlight/github-dark-11.min.css') }}?v={{ vendor_version }}">
    <script src="{{ url_for('static', filename='vendor/highlight/highlight-11.min.js') }}?v={{ vendor_version }}"></script>
    <script src="{{ url_for('static', filename='js/plotly-3.5.0.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ asset_version }}">
    <script>
        if (typeof mermaid !== 'undefined') {
            mermaid.initialize({
                startOnLoad: false,
                theme: document.documentElement.classList.contains('dark') ? 'dark' : 'default',
                securityLevel: 'loose',
                fontFamily: "ui-sans-serif, system-ui, sans-serif",
            });
            new MutationObserver(() => {
                const isDark = document.documentElement.classList.contains('dark');
                mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default', securityLevel: 'loose' });
            }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
        }
    </script>
</head>
<body class="h-full overflow-hidden bg-stone-50 text-stone-800 dark:bg-stone-950 dark:text-stone-200 font-sans antialiased">
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ asset_version }}"></script>
</body>
</html>
