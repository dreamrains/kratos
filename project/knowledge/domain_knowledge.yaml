analysis_rules:
- 留存分析优先使用 cohort 分析
- 关注新手引导完成率与留存的关系
common_pitfalls:
- 测试账号需排除
domain: gaming
indicators:
  ARPU:
    description: 每用户平均收入
    formula: revenue / DAU
  DAU:
    description: 日活跃用户数
    formula: 当日登录用户去重计数
  retention_d7:
    description: 7日留存率
    formula: 7日后仍活跃用户 / 新增用户
learned_patterns: []
suggested_analyses:
- DAU/MAU 趋势与周周期性检测
- 新手引导完成率与 D7 留存相关性
- 付费 vs 非付费用户行为对比
- ARPU 波动归因（价格 vs 活跃度拆解）
- 用户生命周期价值 (LTV) 预测
